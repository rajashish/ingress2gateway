apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gateway.networking.k8s.io/generator: ingress2gateway-v0.5.0-rc1-6-g37f56d8
  name: basic-routing-example-com
spec:
  hostnames:
  - example.com
  parentRefs:
  - name: my-internal-gateway
  rules:
  - backendRefs:
    - name: foo-service
      port: 80
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /
          type: ReplaceFullPath
    matches:
    - path:
        type: PathPrefix
        value: /foo
  - backendRefs:
    - name: bar-service
      port: 8080
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /
          type: ReplaceFullPath
    matches:
    - path:
        type: Exact
        value: /bar
